name: Hostinger post-deploy

on:
  push:
    branches:
      - main

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Scanning Hostinger SSH host key..."

          for attempt in {1..5}; do
            if ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH host key received."
              break
            fi

            echo "ssh-keyscan attempt $attempt failed."

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Unable to reach Hostinger SSH service."
              exit 1
            fi

            sleep 10
          done

          chmod 600 ~/.ssh/known_hosts

      - name: Wait for Hostinger deployment
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for Hostinger to deploy $EXPECTED_SHA..."

          for attempt in {1..30}; do
            REMOTE_SHA=$(ssh \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 \
              -i ~/.ssh/id_ed25519 \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "cd '$DEPLOY_PATH' && git rev-parse HEAD 2>/dev/null || true" \
              | tr -d '\r\n')

            echo "Attempt $attempt: remote commit is $REMOTE_SHA"

            if [ "$REMOTE_SHA" = "$EXPECTED_SHA" ]; then
              echo "Hostinger deployment detected."
              exit 0
            fi

            sleep 20
          done

          echo "Hostinger did not deploy the expected commit within 10 minutes."
          exit 1

      - name: Restore persistent storage
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && bash scripts/post-deploy.sh"